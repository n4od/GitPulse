name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --coverage
      - run: npm run build

      - name: Bundle budget
        run: |
          size=$(find dist/assets -name '*.js' -printf '%s\n' | awk '{s+=$1} END {print s}')
          gz=$(gzip -c dist/assets/*.js | wc -c)
          echo "js raw=${size}B gzip=${gz}B"
          if [ "$gz" -gt 307200 ]; then
            echo "::error::initial JS exceeds the 300 KB gzipped budget"
            exit 1
          fi

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    # The default token is read-only in new repositories, and `rustsec/audit-check`
    # writes a check run — which is why it failed with "Resource not accessible
    # by integration" instead of reporting the advisories it found.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # High and critical only: a moderate advisory in a build tool is not
      # worth blocking a release over, and treating it as one teaches people
      # to ignore the gate.
      - run: npm audit --audit-level=high

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Each advisory is emitted as a workflow annotation, so it is readable
      # without downloading logs. It is also printed as plain text: the runner
      # consumes `::error` lines into the UI, so a log reader otherwise sees a
      # vulnerability *count* and no idea which crate or advisory it refers to —
      # which is exactly what happened when RUSTSEC-2026-0592 first appeared.
      - name: Audit Rust dependencies
        run: |
          cargo audit --file src-tauri/Cargo.lock --json > audit.json || true

          python3 - <<'PY'
          import json, sys

          report = json.load(open("audit.json"))
          vulnerabilities = report.get("vulnerabilities", {}).get("list", []) or []

          for item in vulnerabilities:
              advisory = item["advisory"]
              package = item["package"]
              summary = (
                  f"{advisory['id']}: {package['name']} {package['version']} — "
                  f"{advisory['title']} ({advisory.get('url', '')})"
              )
              print(summary)
              print(f"::error title={advisory['id']}::{summary}")

          warnings = report.get("warnings", {}) or {}
          for kind, items in warnings.items():
              for item in items or []:
                  advisory = item.get("advisory", {})
                  package = item.get("package", {})
                  print(
                      f"::warning title={kind}::"
                      f"{package.get('name')} {package.get('version')} — "
                      f"{advisory.get('title', '')}"
                  )

          print(f"{len(vulnerabilities)} vulnerabilities")

          if vulnerabilities:
              print(
                  "Fix: bump the affected crate (cargo update -p <name>), or record "
                  "a documented exemption if it cannot be reached from this app."
              )
              sys.exit(1)
          PY

  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Pinned to the version this project was verified against. `stable`
          # drifts, and a new clippy lint under `-D warnings` turns that drift
          # into a failed build with no code change.
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
