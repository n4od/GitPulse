name: Release

# Runs only on a version tag, and only produces a *draft*: nothing is published
# until a human reads the notes and checks the artifacts. A desktop release that
# ships itself is a release nobody reviewed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (workflow_dispatch cannot use github.ref_name reliably)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The default token is read-only in new repositories. Creating the draft
# release, uploading assets to it, and reading it back in `verify` all need
# write access to release contents.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: tag
        shell: bash
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.platform }}

      - run: npm ci

      # The tests already ran in CI on the merge; this is the last chance to
      # catch a tag that was cut from a broken commit.
      - name: Verify the tag builds and passes
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets
          npm run test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Signing is deliberately *not* configured yet, so these resolve to
          # empty strings and the bundles are produced unsigned. An unset secret
          # is not an error here; it simply means "do not sign". Adding the
          # secrets below turns signing on with no edit to this file. See
          # RELEASING.md for what each one is and where it comes from.
          #
          # TAURI_SIGNING_PRIVATE_KEY        updater signatures (needs
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD  createUpdaterArtifacts: true)
          # APPLE_CERTIFICATE                macOS signing
          # APPLE_CERTIFICATE_PASSWORD
          # APPLE_SIGNING_IDENTITY
          # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID   notarization
          # WINDOWS_CERTIFICATE              Windows signing
          # WINDOWS_CERTIFICATE_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: "GitPulse ${{ steps.tag.outputs.name }}"
          # Draft: a human reads the notes and checks the artifacts first.
          # Left as a full release rather than a prerelease on purpose — the
          # draft is where that decision is made, and an unsigned bundle is a
          # reason to publish it as a prerelease.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # The bundles above are the *install* path. This is the run-it-straight-
      # from-the-archive path: no admin rights, nothing written outside the
      # user's own data directory. Linux already ships one -- the AppImage.
      - name: Package a portable build (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/package-portable.ps1 -Tag "${{ steps.tag.outputs.name }}"

      - name: Package a portable build (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: bash scripts/package-portable.sh "${{ steps.tag.outputs.name }}" "${{ matrix.args }}"

      - name: Upload the portable build
        if: matrix.platform != 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.name }}" portable/* --clobber

  verify:
    name: Verify the draft
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every expected artifact exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"

          # Let the draft release settle before asking for it.
          sleep 20

          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')

          echo "$assets"

          missing=0
          # One per installed bundle target in tauri.conf.json, plus the
          # portable archives built afterwards. The updater artifacts
          # (.app.tar.gz, latest.json) are intentionally absent while
          # `createUpdaterArtifacts` is off, so they are not listed here.
          for pattern in \
            '\.dmg$' '\.AppImage$' '\.deb$' '\.exe$' '\.msi$' \
            'portable\.zip$' '_portable\.tar\.gz$'
          do
            if ! grep -Eq "$pattern" <<< "$assets"; then
              echo "::error::no artifact matching $pattern in the draft release"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "The draft is incomplete. Do not publish it."
            exit 1
          fi

          echo "All expected artifacts are present."
