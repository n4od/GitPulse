name: Release

# Runs only on a version tag, and only produces a *draft*: nothing is published
# until a human reads the notes and checks the artifacts. A desktop release that
# ships itself is a release nobody reviewed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (workflow_dispatch cannot use github.ref_name reliably)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The default token is read-only in new repositories. Creating the draft
# release, uploading assets to it, and reading it back in `verify` all need
# write access to release contents.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Baked into the binary at compile time by `option_env!` in
  # auth::configured_client_id, so a packaged build can sign in without the user
  # setting anything. A client id is public by design - it identifies the app,
  # not the user - and the device flow never uses a client secret. Stored as a
  # repository variable so it can be repointed without editing this file.
  GITPULSE_GITHUB_CLIENT_ID: ${{ vars.GITPULSE_GITHUB_CLIENT_ID }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `assetPattern` names the uploaded bundle. Without it the name is
          # whatever Tauri's bundler chose, which is *not* consistent across
          # platforms: macOS is named `<product>_<version>_<arch>`, Windows and
          # Linux differ again, and the arch is spelled `amd64` on Debian,
          # `x64` on Windows and `x86_64` in a Rust target triple. One pattern
          # per platform is what makes the release list predictable.
          #
          # `[setup]` expands to `-setup` for the NSIS bundle and to nothing
          # otherwise, so `setup.exe` and `.msi` can share one pattern.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            assetPattern: "GitPulse-[version]-macos-arm64[ext]"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            assetPattern: "GitPulse-[version]-macos-x64[ext]"
          - platform: ubuntu-22.04
            args: ""
            assetPattern: "GitPulse-[version]-linux-x64[ext]"
          - platform: windows-latest
            args: ""
            assetPattern: "GitPulse-[version]-windows-x64[setup][ext]"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: tag
        shell: bash
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.platform }}

      - run: npm ci

      # The tests already ran in CI on the merge; this is the last chance to
      # catch a tag that was cut from a broken commit.
      - name: Verify the tag builds and passes
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets
          npm run test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing variables are declared, and that is deliberate rather
          # than an omission. Declaring one *empty* is not the same as leaving
          # it unset: an empty APPLE_CERTIFICATE made Tauri attempt
          # `security import` on a blank PKCS#12 and fail the macOS bundle
          # outright, on all four builds. To sign, add the secrets and paste
          # the env block from RELEASING.md, "Adding signing".
        with:
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: "GitPulse ${{ steps.tag.outputs.name }}"
          # Draft: a human reads the notes and checks the artifacts first.
          # Left as a full release rather than a prerelease on purpose — the
          # draft is where that decision is made, and an unsigned bundle is a
          # reason to publish it as a prerelease.
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: ${{ matrix.assetPattern }}
          # This defaults to true, and it is the reason every release up to
          # v0.5.5 carried two assets nobody asked for. With it on, the action
          # tars the macOS `.app` itself so it can write `latest.json` — then,
          # finding no signature because no signing key is configured, skips the
          # manifest but *still uploads the tarball it just made*. There is no
          # updater plugin to feed, so the only correct setting is off.
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

      # The bundles above are the *install* path. This is the run-it-straight-
      # from-the-archive path: no admin rights, nothing written outside the
      # user's own data directory. Linux already ships one -- the AppImage.
      - name: Package a portable build (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/package-portable.ps1 -Tag "${{ steps.tag.outputs.name }}"

      - name: Package a portable build (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: bash scripts/package-portable.sh "${{ steps.tag.outputs.name }}" "${{ matrix.args }}"

      # Already named for the release by the scripts above: the version is in
      # the filename, so no second, version-less copy is needed.
      - name: Upload the portable build
        if: matrix.platform != 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.name }}" portable/* --clobber

  verify:
    name: Verify the draft
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every download link in the README is version-pinned, so it has to be
      # bumped in the same commit as the version. Version-pinned links are what
      # replaced the old version-less duplicates, and a README that still names
      # the previous tag is a silent 404 for anyone clicking Download.
      - name: Check the README points at this release
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"

          if grep -q 'releases/latest/download/' README.md; then
            echo "::error::README uses releases/latest/download/, which cannot resolve now that asset names carry the version"
            exit 1
          fi

          stale="$(grep -oE 'releases/download/v[0-9]+\.[0-9]+\.[0-9]+/' README.md | sort -u | grep -v "releases/download/${tag}/" || true)"
          if [ -n "$stale" ]; then
            echo "::error::README still links to: $(echo "$stale" | tr '\n' ' ') - expected releases/download/${tag}/"
            exit 1
          fi

          echo "Every README download link points at ${tag}."

      - name: Check the draft is exactly the expected set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"

          # Let the draft settle before asking for it.
          sleep 20

          # One artifact per platform and format, each named with its version.
          # The list is closed on purpose. An asset nobody asked for is a signal
          # that the pipeline changed underneath us — which is exactly how two
          # dead macOS tarballs went unnoticed for four releases — and a missing
          # one should fail here rather than be discovered by a user.
          expected=(
            "GitPulse-${version}-windows-x64-setup.exe"
            "GitPulse-${version}-windows-x64.msi"
            "GitPulse-${version}-windows-x64-portable.zip"
            "GitPulse-${version}-macos-arm64.dmg"
            "GitPulse-${version}-macos-arm64-portable.tar.gz"
            "GitPulse-${version}-macos-x64.dmg"
            "GitPulse-${version}-macos-x64-portable.tar.gz"
            "GitPulse-${version}-linux-x64.deb"
            "GitPulse-${version}-linux-x64.AppImage"
          )

          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          # The checksum manifest is uploaded by the step below, so a re-run of
          # this job must not count it as an unexpected asset.
          gh release view "$tag" --json assets --jq '.assets[].name' \
            | grep -v '^SHA256SUMS.txt$' | sort > /tmp/actual.txt

          echo "--- expected ---"
          cat /tmp/expected.txt
          echo "--- actual ---"
          cat /tmp/actual.txt

          if ! diff -u /tmp/expected.txt /tmp/actual.txt; then
            echo "::error::the draft is not exactly the expected artifact set"
            exit 1
          fi

          echo "All nine artifacts are present, and nothing else."

      - name: Publish SHA-256 checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          set -euo pipefail

          mkdir -p dist
          # Hash what actually arrived, not what the build produced: downloading
          # it again is the only way to prove the upload survived intact, and
          # these bundles are unsigned, so a checksum is the only integrity
          # signal a user has.
          gh release download "$tag" --dir dist --pattern 'GitPulse-*'

          cd dist
          sha256sum GitPulse-* > SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

          gh release upload "$tag" SHA256SUMS.txt --clobber
