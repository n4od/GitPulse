name: Release

# Runs only on a version tag, and only produces a *draft*: nothing is published
# until a human reads the notes and checks the artifacts. A desktop release that
# ships itself is a release nobody reviewed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (workflow_dispatch cannot use github.ref_name reliably)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: tag
        shell: bash
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.platform }}

      - run: npm ci

      # The tests already ran in CI on the merge; this is the last chance to
      # catch a tag that was cut from a broken commit.
      - name: Verify the tag builds and passes
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets
          npm run test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Update signing. Without these, `createUpdaterArtifacts` fails rather
          # than producing an unsigned updater — which is the correct failure.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # macOS notarization. Apple requires an app-specific password here,
          # not the account password.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # Windows code signing. Unsigned installers trigger SmartScreen, which
          # is a delivery problem rather than a build one.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: "GitPulse ${{ steps.tag.outputs.name }}"
          # Draft: a human reads the notes and checks the artifacts first.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  verify:
    name: Verify the draft
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every expected artifact exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"

          # Let the draft release settle before asking for it.
          sleep 20

          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')

          echo "$assets"

          missing=0
          for pattern in \
            '\.dmg$' '\.app\.tar\.gz$' '\.AppImage$' '\.deb$' '\.exe$' '\.msi$' 'latest\.json$'
          do
            if ! grep -Eq "$pattern" <<< "$assets"; then
              echo "::error::no artifact matching $pattern in the draft release"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "The draft is incomplete. Do not publish it."
            exit 1
          fi

          echo "All expected artifacts are present."
