name: Release

# Runs only on a version tag, and only produces a *draft*: nothing is published
# until a human reads the notes and checks the artifacts. A desktop release that
# ships itself is a release nobody reviewed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (workflow_dispatch cannot use github.ref_name reliably)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Creating the draft, uploading assets to it, and reading it back in `verify`
# all need write access to release contents. The default token is read-only.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Baked into the binary at compile time by `option_env!` in
  # auth::configured_client_id, so a packaged build can sign in without the user
  # setting anything. A client id is public by design - it identifies the app,
  # not the user - and the device flow never uses a client secret. Stored as a
  # repository variable so it can be repointed without editing this file.
  GITPULSE_GITHUB_CLIENT_ID: ${{ vars.GITPULSE_GITHUB_CLIENT_ID }}

jobs:
  # The draft is created once, here, so that four build jobs can upload into the
  # same release.
  #
  # It is not created by tauri-action, because that would also make the action
  # upload the bundles - and on macOS the action *unconditionally* tars the .app
  # for the updater:
  #
  #   # Other steps may benefit from this so we do this whether or not we want
  #   # to upload it.
  #   if (targetInfo.platform === 'macos') { ... tar czf ...app.tar.gz ... }
  #
  # That tarball then lands in the release whether or not an updater exists,
  # which is where the two dead assets in every release up to v0.5.5 came from.
  # No input turns it off. So the action is used to *build*, and naming and
  # uploading are done explicitly below.
  prepare:
    name: Prepare the draft
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - name: Resolve the tag
        id: tag
        shell: bash
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.name }}"

          # --repo is explicit because this job does not check out, so there is
          # no git remote for `gh` to infer one from.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "a release for ${tag} already exists; leaving it alone"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "GitPulse ${tag}" \
              --notes "Draft. The artifacts are still being built; the release notes are written when it is published."
          fi

  build:
    # Named by slug, not by runner label: the two macOS jobs share a runner, and
    # two identically-titled jobs in the UI is how the wrong one gets re-run.
    name: Build (${{ matrix.slug }})
    needs: prepare
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `slug` names the release assets. `key` is the platform identifier the
          # updater expects inside latest.json. They are deliberately not the
          # same spelling: `macos-arm64` is ours, `darwin-aarch64` is Tauri's.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            slug: macos-arm64
            key: darwin-aarch64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            slug: macos-x64
            key: darwin-x86_64
          - platform: ubuntu-22.04
            args: ""
            slug: linux-x64
            key: linux-x86_64
          - platform: windows-latest
            args: ""
            slug: windows-x64
            key: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.platform }}

      - run: npm ci

      # The tests already ran in CI on the merge; this is the last chance to
      # catch a tag that was cut from a broken commit.
      - name: Verify the tag builds and passes
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets
          npm run test

      # Build only: no tagName, no releaseId, so the action uploads nothing.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater keypair, and only that. This is not code signing: it is
          # the minisign key the app checks a downloaded update against, and it
          # is free to generate (`npm run tauri signer generate`). The public half
          # is committed in tauri.conf.json; this is the private half.
          #
          # It is *required*. `createUpdaterArtifacts` is on, so a release
          # without it fails outright - "A public key has been found, but no
          # private key" - rather than shipping an update nothing can verify.
          # That coupling is the point: an updater nobody can verify is worse
          # than no updater.
          #
          # The Authenticode and Apple variables stay undeclared on purpose.
          # Declaring one *empty* is not the same as leaving it unset: an empty
          # APPLE_CERTIFICATE made Tauri attempt `security import` on a blank
          # PKCS#12 and fail every macOS bundle. Those are a separate, paid,
          # still-not-configured concern - see RELEASING.md, "Adding code
          # signing". If the key was generated without a password, delete the
          # PASSWORD line rather than leaving it empty.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      # The bundles above are the *install* path. This is the run-it-straight-
      # from-the-archive path: no admin rights, nothing written outside the
      # user's own data directory. Linux already ships one -- the AppImage.
      - name: Package a portable build (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/package-portable.ps1 -Tag "${{ needs.prepare.outputs.tag }}"

      - name: Package a portable build (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: bash scripts/package-portable.sh "${{ matrix.args }}"

      # Tauri writes each bundle into its own directory, under a name that
      # carries the version and one of three spellings for the architecture
      # (`amd64` in a Debian package, `x64` on Windows, `x86_64` in a Rust
      # target triple). The release names are ours, and they deliberately carry
      # no version: /releases/latest/download/<name> only resolves while the
      # name is unchanged from release to release, and that is what the README's
      # download buttons depend on.
      - name: Collect the release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets updater

          slug="${{ matrix.slug }}"
          FOUND=""

          # Expand globs rather than shelling out to `find`, so a pattern that
          # matches nothing cannot become an empty argument.
          #
          # The previous version was `cp "$(find ...)"`. A miss reached `cp` as
          # `cp: cannot stat ''` - no pattern named, no directory contents, and
          # twenty-five minutes to find that out. A failure here has to say what
          # it wanted and what was there instead.
          #
          # `globstar` lets the updater artifacts be found recursively, because
          # Tauri places them by its own rules; the installers keep their
          # documented directories.
          shopt -s nullglob globstar

          find_one() {
            local label="$1"
            shift
            local pattern match

            for pattern in "$@"; do
              for match in $pattern; do
                FOUND="$match"
                return 0
              done
            done

            {
              echo "::error::could not find ${label}"
              echo "--- patterns tried ---"
              for pattern in "$@"; do echo "  ${pattern}"; done
              echo "--- actually on disk ---"
              if [ -d src-tauri/target ]; then
                find src-tauri/target -maxdepth 6 -print | sort | head -80
              else
                echo "  (src-tauri/target does not exist)"
              fi
            } >&2
            exit 1
          }

          case "${{ matrix.platform }}" in
            windows-latest)
              # The NSIS installer *is* the update payload: Tauri signs the .exe
              # rather than wrapping it in a second archive, so the only thing
              # this platform contributes is a signature.
              find_one 'the NSIS installer' \
                'src-tauri/target/release/bundle/nsis/*.exe'
              cp "$FOUND" "release-assets/GitPulse-${slug}-setup.exe"

              find_one 'the MSI' \
                'src-tauri/target/release/bundle/msi/*.msi'
              cp "$FOUND" "release-assets/GitPulse-${slug}.msi"

              cp "portable/GitPulse-${slug}-portable.zip" release-assets/

              find_one 'the installer signature' \
                'src-tauri/target/release/bundle/**/*.exe.sig'
              sig="$FOUND"
              payload="GitPulse-${slug}-setup.exe"
              ;;
            ubuntu-22.04)
              find_one 'the .deb' \
                'src-tauri/target/release/bundle/deb/*.deb'
              cp "$FOUND" "release-assets/GitPulse-${slug}.deb"

              find_one 'the AppImage' \
                'src-tauri/target/release/bundle/appimage/*.AppImage'
              cp "$FOUND" "release-assets/GitPulse-${slug}.AppImage"

              find_one 'the AppImage update payload' \
                'src-tauri/target/release/bundle/**/*.AppImage.tar.gz'
              cp "$FOUND" "release-assets/GitPulse-${slug}-updater.tar.gz"

              find_one 'the AppImage update signature' \
                'src-tauri/target/release/bundle/**/*.AppImage.tar.gz.sig'
              sig="$FOUND"
              payload="GitPulse-${slug}-updater.tar.gz"
              ;;
            macos-latest)
              target="${{ matrix.args }}"
              target="${target#--target }"

              find_one 'the .dmg' \
                "src-tauri/target/${target}/release/bundle/dmg/*.dmg"
              cp "$FOUND" "release-assets/GitPulse-${slug}.dmg"

              cp "portable/GitPulse-${slug}-portable.tar.gz" release-assets/

              find_one 'the .app update payload' \
                "src-tauri/target/${target}/release/bundle/**/*.app.tar.gz"
              cp "$FOUND" "release-assets/GitPulse-${slug}-updater.tar.gz"

              find_one 'the .app update signature' \
                "src-tauri/target/${target}/release/bundle/**/*.app.tar.gz.sig"
              sig="$FOUND"
              payload="GitPulse-${slug}-updater.tar.gz"
              ;;
            *)
              # Without this, an unrecognised platform falls through the case and
              # dies on `$sig: unbound variable` - a message about the wrong thing
              # entirely.
              echo "::error::no collect branch for matrix platform '${{ matrix.platform }}'" >&2
              exit 1
              ;;
          esac

          # Reading the signature proves the key was used, and names the missing
          # secret when it was not - rather than failing later inside a merge.
          if [ ! -s "$sig" ]; then
            echo "::error::no updater signature for ${slug}. Is TAURI_SIGNING_PRIVATE_KEY set?"
            exit 1
          fi

          # This platform's slice of latest.json. Written here because this job is
          # the only one holding the signature, and merged in `verify` because no
          # single job knows about the other three.
          python3 - "${{ needs.prepare.outputs.tag }}" "${{ matrix.key }}" "${payload}" "${sig}" \
            > "updater/latest-${{ matrix.key }}.json" <<'PY'
          import json
          import os
          import sys

          tag, platform, payload, sig_path = sys.argv[1:5]

          with open(sig_path, encoding="utf-8") as handle:
              signature = handle.read().strip()

          repo = os.environ["GITHUB_REPOSITORY"]
          json.dump(
              {
                  "platforms": {
                      platform: {
                          "signature": signature,
                          # Pinned to this tag rather than latest/download: the
                          # manifest is regenerated per release, so the URL it
                          # names can be immutable. A stable path could hand a
                          # client the wrong release's bytes in a tight window.
                          "url": f"https://github.com/{repo}/releases/download/{tag}/{payload}",
                      }
                  }
              },
              sys.stdout,
          )
          PY

          ls -l release-assets updater

      - name: Upload this platform's manifest fragment
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.slug }}
          path: updater/latest-*.json
          if-no-files-found: error

      - name: Upload the release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" release-assets/* --clobber

  verify:
    name: Verify the draft
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The README links to /releases/latest/download/<name>, which only works
      # while every release carries those exact names. A renamed artifact is a
      # silent 404 for anyone clicking Download, so the names are cross-checked
      # against the README here rather than discovered by a user.
      - name: Check the README links to these exact files
        shell: bash
        run: |
          missing=0
          for name in \
            GitPulse-windows-x64-setup.exe \
            GitPulse-windows-x64.msi \
            GitPulse-windows-x64-portable.zip \
            GitPulse-macos-arm64.dmg \
            GitPulse-macos-arm64-portable.tar.gz \
            GitPulse-macos-x64.dmg \
            GitPulse-macos-x64-portable.tar.gz \
            GitPulse-linux-x64.deb \
            GitPulse-linux-x64.AppImage
          do
            if ! grep -q "releases/latest/download/${name}" README.md; then
              echo "::error::README has no latest/download link for ${name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "The README links to all nine files."

      # Each build job wrote the slice of the update manifest it could know about.
      # This is where four independent builds become one file - and where a
      # platform that silently produced no signature is caught, because a manifest
      # missing a platform is a platform whose users never get an update.
      - name: Collect this platform's manifest fragments
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: updater
          merge-multiple: true

      - name: Assemble the update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"

          python3 - "$tag" <<'PY'
          import datetime
          import json
          import pathlib
          import sys

          tag = sys.argv[1]

          platforms = {}
          for fragment in sorted(pathlib.Path("updater").glob("latest-*.json")):
              platforms.update(json.loads(fragment.read_text(encoding="utf-8"))["platforms"])

          wanted = {"windows-x86_64", "darwin-aarch64", "darwin-x86_64", "linux-x86_64"}
          if set(platforms) != wanted:
              sys.exit(
                  f"error: the manifest covers {sorted(platforms)}, expected {sorted(wanted)}"
              )

          manifest = {
              "version": tag.removeprefix("v"),
              "notes": f"See the release notes for {tag}.",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime(
                  "%Y-%m-%dT%H:%M:%SZ"
              ),
              "platforms": platforms,
          }

          with open("latest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2)

          print(json.dumps(manifest, indent=2))
          PY

          gh release upload "$tag" latest.json --clobber

      - name: Check the draft is exactly the expected set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ needs.prepare.outputs.tag }}"

          # Let the draft settle before asking for it.
          sleep 20

          # One artifact per platform and format. The list is closed on purpose:
          # an asset nobody asked for means the pipeline changed underneath us,
          # which is exactly how two dead macOS tarballs went unnoticed for four
          # releases. A missing one fails here rather than reaching a user.
          #
          # The nine at the top are what a human downloads, and what the README
          # links to. The `-updater.tar.gz` files and `latest.json` below are
          # machinery: the updater fetches them, and nobody should be pointed at
          # them by hand. Windows contributes no updater artifact because its NSIS
          # installer doubles as one.
          expected=(
            "GitPulse-windows-x64-setup.exe"
            "GitPulse-windows-x64.msi"
            "GitPulse-windows-x64-portable.zip"
            "GitPulse-macos-arm64.dmg"
            "GitPulse-macos-arm64-portable.tar.gz"
            "GitPulse-macos-x64.dmg"
            "GitPulse-macos-x64-portable.tar.gz"
            "GitPulse-linux-x64.deb"
            "GitPulse-linux-x64.AppImage"
            "GitPulse-macos-arm64-updater.tar.gz"
            "GitPulse-macos-x64-updater.tar.gz"
            "GitPulse-linux-x64-updater.tar.gz"
            "latest.json"
          )

          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          # The checksum manifest is uploaded by the step below, so a re-run of
          # this job must not count it as an unexpected asset.
          gh release view "$tag" --json assets --jq '.assets[].name' \
            | grep -v '^SHA256SUMS.txt$' | sort > /tmp/actual.txt

          echo "--- expected ---"
          cat /tmp/expected.txt
          echo "--- actual ---"
          cat /tmp/actual.txt

          if ! diff -u /tmp/expected.txt /tmp/actual.txt; then
            echo "::error::the draft is not exactly the expected artifact set"
            exit 1
          fi

          echo "All nine artifacts are present, and nothing else."

      - name: Publish SHA-256 checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          set -euo pipefail

          mkdir -p dist
          # Hash what actually arrived, not what the build produced: downloading
          # it again is the only way to prove the upload survived, and these
          # bundles are unsigned, so a checksum is the only integrity signal a
          # user has.
          gh release download "$tag" --dir dist --pattern 'GitPulse-*'

          cd dist
          sha256sum GitPulse-* > SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

          gh release upload "$tag" SHA256SUMS.txt --clobber
