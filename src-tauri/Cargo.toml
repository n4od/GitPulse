[package]
name = "gitpulse"
version = "0.5.0"
description = "Local-first GitHub workflow monitor"
edition = "2021"
rust-version = "1.85"

[lib]
name = "gitpulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

thiserror = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

regex = "1"
url = "2"
rusqlite = { version = "0.43", features = ["bundled", "chrono"] }
reqwest = { version = "0.13.5", features = ["json", "gzip", "form", "stream"] }
secrecy = "0.10.3"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }
async-trait = "0.1.92"
axum = "0.8.9"
hmac = "0.13.0"
sha2 = "0.11.0"
subtle = "2.6.1"
hex = "0.4.3"
getrandom = "0.4.3"
tauri-plugin-notification = "2.4.0"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-autostart = "2.5.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = "s"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
